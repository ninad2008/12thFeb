<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        header{
            background-color: rgb(43, 39, 81);
            display: flex;
        }
        .logo{
            color: white;
            padding: 20px;
        }
        .search{
            margin: 10px;
            width: 85%;
            padding-left: 20px;
        }
        .button{
            margin: 10px;
            background-color: rgb(65, 58, 123);
            color: white;
        }
        main{
            background-color: lightgrey;
            display: flex;
        }
        .aside{
            background-color: rgb(25, 18, 90);
            width: 30%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color:white;
            padding-bottom: 80px; 
        }
        a{
            margin-left: 30px ;
            padding: 10px;
        }
        main div{
            background-color: white;
            margin: 30px;
            border-radius: 15px;
            height: 20%;
            padding: 20px;
            width: 30%;
            text-align: center;
        
        }
        .most{
            width: 100%;
            background-color: lightgrey;
        }
        .hi{
            display: flex;
            background-color: lightgrey;
            width: 100%;
        }
        .hello{
            width: 100%;
            background-color: lightgray;
            display: flex;
        }
        .hello div{
            width: 100%;
            background-color: blue;
            color: white;
        }
        footer{
            color: white;
            text-align: center;
            padding: 10px;
            background-color: rgb(43, 39, 81);
        }
    </style>
</head>
<body>
    <header>
        <h2 class="logo">FlexDash</h2>
        <input class="search" type="search" placeholder="Search Dashboard...">
        <button class="button">👤 Admin</button>
    </header>
    <main>
        <aside class="aside">
            <a>Dashboard</a>
            <a>Analytics</a>
            <a>Users</a>
            <a>Reports</a>
            <a>Settings</a>
        </aside>
        <div class="most">
        <div class="hi">
        <div>Users<br>1,240</div>
        <div>Revenue<br>₹2.4L</div>
        <div>Orders<br>320</div>
        </div>
        <div class="hello">
        <div>Users<br>1,240</div>
        <div>Revenue<br>₹2.4L</div>
        </div>
        </div>
    </main>
    <footer>
        @ 2026 flexbox Dashboard -- Student Practical Task
    </footer>
</body>
</html>
